name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build + Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect release type
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-rc."* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install rcodesign (for macOS binary signing from Linux)
        run: |
          set -euo pipefail
          # Install cargo-binstall for fast pre-built binary downloads
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          # Install rcodesign (from apple-codesign crate) via pre-built binary
          cargo binstall --no-confirm apple-codesign
          rcodesign --version

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build release binaries
        run: bun run build:release

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/agent-slack-*
            release/checksums-sha256.txt
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}

      - name: Build for npm
        run: bun run build:npm

      - name: Publish to npm
        run: npm publish --provenance --access public --tag ${{ steps.meta.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
